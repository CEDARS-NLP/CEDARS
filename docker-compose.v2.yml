version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cedars
      POSTGRES_USER: cedars
      POSTGRES_PASSWORD: cedars
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedars"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rootuser
      MINIO_ROOT_PASSWORD: rootpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CEDARS_DATABASE_URL: postgresql+asyncpg://cedars:cedars@db:5432/cedars
      CEDARS_REDIS_URL: redis://redis:6379
      CEDARS_S3_ENDPOINT: http://minio:9000
      CEDARS_S3_BUCKET: cedars
      CEDARS_S3_ACCESS_KEY: rootuser
      CEDARS_S3_SECRET_KEY: rootpassword
      CEDARS_SECRET_KEY: dev-secret-key

  worker:
    build: ./backend
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    extra_hosts:
      - "plmimskbia4:10.254.130.44"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CEDARS_DATABASE_URL: postgresql+asyncpg://cedars:cedars@db:5432/cedars
      CEDARS_REDIS_URL: redis://redis:6379
      CEDARS_S3_ENDPOINT: http://minio:9000
      CEDARS_S3_BUCKET: cedars
      CEDARS_S3_ACCESS_KEY: rootuser
      CEDARS_S3_SECRET_KEY: rootpassword
      CEDARS_SECRET_KEY: dev-secret-key

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.v2.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  pgdata:
  minio_data:
