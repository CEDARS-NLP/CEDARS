version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cedars
      POSTGRES_USER: cedars
      POSTGRES_PASSWORD: cedars
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedars"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      CEDARS_DATABASE_URL: postgresql+asyncpg://cedars:cedars@db:5432/cedars

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${CEDARS_S3_ACCESS_KEY:-rootuser}
      AWS_SECRET_ACCESS_KEY: ${CEDARS_S3_SECRET_KEY:-rootpassword}
      S3_BUCKET: ${CEDARS_S3_BUCKET:-cedars}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "8000:8000"
    extra_hosts:
      # VPN-only LLM hosts, unresolvable from inside the container's DNS.
      - "ppliapppytorc01:10.254.160.26"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      CEDARS_DATABASE_URL: postgresql+asyncpg://cedars:cedars@db:5432/cedars
      CEDARS_REDIS_URL: redis://redis:6379
      CEDARS_S3_ENDPOINT: http://seaweedfs:8333
      CEDARS_S3_BUCKET: ${CEDARS_S3_BUCKET:-cedars}
      CEDARS_S3_ACCESS_KEY: ${CEDARS_S3_ACCESS_KEY:-rootuser}
      CEDARS_S3_SECRET_KEY: ${CEDARS_S3_SECRET_KEY:-rootpassword}
      CEDARS_S3_REGION: us-east-1
      CEDARS_SECRET_KEY: dev-secret-key

  worker:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    extra_hosts:
      - "plmimskbia4:10.254.130.44"
      # VPN-only LLM hosts, unresolvable from inside the container's DNS.
      - "ppliapppytorc01:10.254.160.26"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      CEDARS_DATABASE_URL: postgresql+asyncpg://cedars:cedars@db:5432/cedars
      CEDARS_REDIS_URL: redis://redis:6379
      CEDARS_S3_ENDPOINT: http://seaweedfs:8333
      CEDARS_S3_BUCKET: ${CEDARS_S3_BUCKET:-cedars}
      CEDARS_S3_ACCESS_KEY: ${CEDARS_S3_ACCESS_KEY:-rootuser}
      CEDARS_S3_SECRET_KEY: ${CEDARS_S3_SECRET_KEY:-rootpassword}
      CEDARS_S3_REGION: us-east-1
      CEDARS_SECRET_KEY: dev-secret-key

  frontend:
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.v2.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  pgdata:
  seaweedfs_data:
