  # -----------------------
  # Launch Template
  # -----------------------
  SQSBERTSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group For BERT inference connections
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: cost-center
          Value: '99424'
        - Key: owner-email
          Value: manthas@mskcc.org
        - Key: resource-name
          Value: WebServerSecurityGroup

  SQSBERTLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: g4dn.xlarge
        ImageId: !Sub ami-073d9221f657bc5ff
        SecurityGroupIds:
          - !Ref SQSBERTSecurityGroup
        IamInstanceProfile:
          Arn: arn:aws:iam::730335493184:instance-profile/userServiceRoleBERTInferenceInstance
        BlockDeviceMappings:
          - DeviceName: /dev/xvda # Root volume (use /dev/sda1 for some AMIs)
            Ebs:
              VolumeSize: 64 # Size in GB
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        UserData: !Base64
          Fn::Sub: |
            #!/bin/bash
            set -e

            # Update system
            dnf update -y

            # Install dnf plugin
            dnf -y install dnf-plugins-core
            # Add CentOS repository
            dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
            # Adjust release server version in the path as it will not match with Amazon Linux 2023
            sed -i 's/$releasever/9/g' /etc/yum.repos.d/docker-ce.repo
            # Install as usual
            dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            # Enable the docker service
            systemctl enable --now docker

            # Install Git
            dnf install -y git

            usermod -aG docker ec2-user

            # Clone repo
            cd /home/ec2-user
            git clone https://github.com/Kayan1920/PINES-ECS-DEPLOYMENT.git  --branch base_template app
            cd app

            cat > /home/ec2-user/app/.env << EOF
            MODEL_S3_PATH=${ModelS3Path}
            MAX_LENGTH=256
            AWS_REGION=${AWS::Region}
            QUEUE_URL=${InferenceQueue}
            EOF

            systemctl enable docker
            systemctl start docker

            # Build Docker image
            echo "Starting docker build"
            docker build -t bert-worker .
            echo "Finished docker build"
            docker run -d --restart unless-stopped --env-file .env bert-worker
            echo "Docker is now running"

  # -----------------------
  # Auto Scaling Group
  # -----------------------
  SQSBERTAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: 0
      VPCZoneIdentifier:
        - !Ref SubnetId
      LaunchTemplate:
        LaunchTemplateId: !Ref SQSBERTLaunchTemplate
        Version: !GetAtt SQSBERTLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: cost-center
          Value: '99424'
          PropagateAtLaunch: true
        - Key: owner-email
          Value: manthas@mskcc.org
          PropagateAtLaunch: true
        - Key: resource-name
          Value: SQSBERTAutoScalingGroup
          PropagateAtLaunch: true

  # -----------------------
  # Scale Policies
  # -----------------------
  SQSBERTScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref SQSBERTAutoScalingGroup
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: 60

  SQSBERTQueueDepthHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InferenceQueue.QueueName
      AlarmActions:
        - !Ref SQSBERTScaleUpPolicy
      Tags:
        - Key: cost-center
          Value: '99424'
        - Key: owner-email
          Value: manthas@mskcc.org
        - Key: resource-name
          Value: SQSBERTQueueDepthHigh

  SQSBERTScaleDownPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref SQSBERTAutoScalingGroup
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1
      Cooldown: 1800 # 30 minute cooldown

  SQSBERTQueueDepthLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 30
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InferenceQueue.QueueName
      AlarmActions:
        - !Ref SQSBERTScaleDownPolicy
      Tags:
        - Key: cost-center
          Value: '99424'
        - Key: owner-email
          Value: manthas@mskcc.org
        - Key: resource-name
          Value: SQSBERTQueueDepthLow

Outputs:
  InferenceQueueURL:
    Value: !Ref InferenceQueue

  ResponseQueueURL:
    Value: !Ref ResponseQueue

  WebsiteURL:
    Value: !Join
      - ''
      - - http://
        - !GetAtt WebServer.PrivateDnsName
    Description: Website URL