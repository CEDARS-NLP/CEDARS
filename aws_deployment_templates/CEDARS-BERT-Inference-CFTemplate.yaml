AWSTemplateFormatVersion: '2010-09-09'
Description: Fully self-contained GPU ECS worker that clones GitHub and builds locally

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  GitHubRepo:
    Type: String
    Description: https://github.com/Kayan1920/PINES-ECS-DEPLOYMENT.git

  InstanceType:
    Type: String
    Default: g5.xlarge
    AllowedValues:
      - g4dn.xlarge
      - g5.xlarge
      - g5.2xlarge

Resources:

# -----------------------
# SQS Queue
# -----------------------
  InferenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900

# -----------------------
# ECS Cluster
# -----------------------
  ECSCluster:
    Type: AWS::ECS::Cluster

# -----------------------
# IAM Roles
# -----------------------
  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ECSInstanceRole

# -----------------------
# Launch Template
# -----------------------
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: ami-0c02fb55956c7d316  # Replace with latest ECS GPU Optimized AMI
        IamInstanceProfile:
          Name: !Ref ECSInstanceProfile
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -xe

            # Join ECS Cluster
            echo ECS_CLUSTER=${ECSCluster} >> /etc/ecs/ecs.config

            # Install git
            yum install -y git

            # Clone repo
            cd /home/ec2-user
            git clone https://github.com/Kayan1920/PINES-ECS-DEPLOYMENT.git app
            cd app

            # Build Docker image
            docker build -t bert-worker .

# -----------------------
# Auto Scaling Group
# -----------------------
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: 0
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

# -----------------------
# Scale Policies
# -----------------------
  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: 60

  QueueDepthHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InferenceQueue.QueueName
      AlarmActions:
        - !Ref ScaleUpPolicy

  ScaleDownPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1
      Cooldown: 1800

  QueueDepthLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 30
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InferenceQueue.QueueName
      AlarmActions:
        - !Ref ScaleDownPolicy

Outputs:
  QueueURL:
    Value: !Ref InferenceQueue