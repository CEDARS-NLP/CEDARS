version: '3.8'

services:
  # Option 1: Ollama backend (easiest, works on CPU)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cedars
    profiles:
      - ollama
    # Pull model on startup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull llama3.1:8b
        wait

  # Option 2: vLLM backend (GPU-accelerated, production)
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model meta-llama/Llama-3.1-70B-Instruct
      --port 8000
      --max-model-len 4096
      --gpu-memory-utilization 0.9
    ports:
      - "8000:8000"
    networks:
      - cedars
    profiles:
      - vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

  # LLM-PINES Gateway Service
  llm-pines:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8036:8036"
    environment:
      - BACKEND_TYPE=${BACKEND_TYPE:-ollama}
    volumes:
      - ./llm_config.yaml:/app/llm_config.yaml
      - ./prompts:/app/prompts
    networks:
      - cedars
    profiles:
      - ollama
      - vllm
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  cedars:
    driver: bridge




