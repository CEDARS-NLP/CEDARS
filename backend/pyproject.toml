[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "cedars-backend"
version = "2.0.0"
description = "CEDARS v2 FastAPI backend"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "boto3>=1.35",
    "redis>=5.2",
    "arq>=0.26",
    "litellm>=1.40",
    "httpx>=0.28",
    "databricks-sql-connector>=3.0.0",
    "email-validator>=2.0",
    "tiktoken>=0.7",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-multipart>=0.0.9",
    "spacy>=3.7",
    "google-re2>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.13",
    "aiosqlite>=0.21",
    "testcontainers[postgres]>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Formatting is not enforced yet (44 files would change); long lines are left to a later cleanup.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
# Ratchet: only ever raise this. Measured 61% on 2026-10-07.
fail_under = 60

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Gated by scripts/mypy_ratchet.py against backend/.mypy-baseline (errors may not increase).
