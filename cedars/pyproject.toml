[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "cedars"
version = "2025.1"
description = "A highly efficient NLP-based data labelling platform"
authors = [
	{ name = "Rohan Singh", email = "SinghR7@mskcc.org" },
	{ name = "Kayan Irani", email = "iranik@mskcc.org" },
]
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
	"a2wsgi>=1.10.10",
	"alembic>=1.13.3",
	"arq>=0.26",
	"bcrypt>=4.0,<4.1",
	"beautifulsoup4>=4.14.2",
	"boto3>=1.40.56",
	"ddtrace>=3.16.2",
	"en-core-sci-lg @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_lg-0.5.4.tar.gz",
	"faker>=19.13.0",
	"fastapi>=0.115.0",
	"fastparquet>=2023.10.1",
	"flask>=3.1.0",
	"gunicorn>=22.0.0",
	"idna>=3.11",
	"loguru>=0.7.3",
	"minio==7.2.18",
	"mkdocs>=1.5.3",
	"mkdocstrings-python>=1.18.2",
	"negspacy>=1.0.4",
	"pandas>=2.3.3",
	"passlib[bcrypt]>=1.7",
	"passvalidate==0.1.3",
	"polars==1.9.0",
	"prometheus-fastapi-instrumentator>=7.0.0",
	"psycopg2-binary>=2.9.9",
	"pyarrow>=16.1.0",
	"pydantic>=2.0",
	"pyjwt>=2.9.0",
	"python-dotenv>=1.1.1",
	"python-jose[cryptography]>=3.3",
	"python-multipart>=0.0.9",
	"redis>=5.0.8",
	"requests>=2.32.0",
	"rq>=1.16.2,<2",
	"rq-dashboard>=0.8.2,<0.9",
	"scipy>=1.10.1",
	"scispacy>=0.6.0",
	"sqlalchemy>=2.0.35",
	"tenacity==9.0.0",
	"uvicorn[standard]>=0.30.6",
	"werkzeug>=3.1.3",
]

[project.optional-dependencies]
dev = [
	"coverage>=7.3.0",
	"fakeredis[lua]>=2.23.0",
	"flake8>=6.1.0",
	"httpx>=0.27.0",
	"jupyterlab>=4.0.2",
	"pylint>=2.17.4",
	"psycopg[binary]>=3.0",
	"pytest>=7.4.0",
	"pytest-asyncio>=0.23.0",
	"pytest-cov>=5.0.0",
	"pytest-dotenv>=0.5.2",
	"pytest-postgresql>=6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests_fastapi"]
