[project]
name = "cedars"
version = "2025.1"
description = "A highly efficient, nlp based data labelling platform"
authors = [
    {name = "Rohan Singh", email = "SinghR7@mskcc.org"},
    {name = "Kayan Irani", email = "iranik@mskcc.org"}
]
license = {text = "GPL"}
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "Flask-Caching>=2.0.2",
    "Flask-Login>=0.6.2",
    "python-dotenv>=1.0.0",
    "scispacy>=0.6.0",
    "flask-pymongo>=3.0.0",
    "pandas>=2.0.2",
    "scipy>=1.11.0",
    "negspacy>=1.0.3",
    "flask-session>=0.6.0",
    "faker>=19.3.0",
    "minio>=7.1.16",
    "mkdocs>=1.5.3",
    "pydantic>=2.0.0",
    "fastparquet>=2023.8.0",
    "loguru>=0.7.2",
    "tdqm>=0.0.1",
    "en-core-sci-lg @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_lg-0.5.4.tar.gz",
    "gunicorn>=22.0.0",
    "beautifulsoup4>=4.12.3",
    "pyarrow>=16.0.0",
    "idna>=3.7",
    "flask>=3.0.3",
    "pymongo>=4.2",
    "rq>=1.16.2",
    "tenacity>=9.0.0",
    "passvalidate>=0.1.3",
    "mongomock>=4.1.2",
    "rq_dashboard>=0.8.6",
    "polars>=1.9.0",
    "mkdocstrings-python>=1.12.2",
    "gevent>=24.11.1",
    "werkzeug>=3.1.3",
    "prometheus-client>=0.21.1",
    "prometheus-flask-exporter>=0.23.2",
    "litellm>=1.40.0",
]

[dependency-groups]
dev = [
    "pylint>=2.17.4",
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "jupyterlab>=4.0.2",
    "coverage>=7.3.0",
    "pytest-cov>=5.0.0",
    "mongomock>=4.1.2",
    "fakeredis[lua]>=2.23.0",
    "pytest-minio-mock>=0.4.13",
    "pytest-dotenv>=0.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
