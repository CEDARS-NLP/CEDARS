[tool.poetry]
name = "cedars"
version = "2025.1"
description = "A highly efficient,nlp based data labelling platform"
authors = ["Rohan Singh <SinghR7@mskcc.org>", "Kayan Irani <iranik@mskcc.org>"]
license = "GPL"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
nmslib = "2.1.1"
python-dotenv = "^1.1.1"
scispacy = "^0.5.3"
pandas = "^2.3.3"
scipy = "^1.10.1"
negspacy = "^1.0.4"
faker = "^19.13.0"
minio = "7.2.18"
mkdocs = "^1.5.3"
pydantic = "^2.0"
fastparquet = "^2023.10.1"
loguru = "^0.7.3"
tdqm = "^0.0.1"
en-core-sci-lg = {url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.3/en_core_sci_lg-0.5.3.tar.gz"}
gunicorn = "^22.0.0"
beautifulsoup4 = "^4.14.2"
pyarrow = "^16.1.0"
idna = "^3.11"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.3"
redis = "^5.0.8"
rq = "^1.16.2"
tenacity = "9.0.0"
passvalidate = "0.1.3"
boto3 = "^1.40.56"
polars = "1.9.0"
mkdocstrings-python = "^1.18.2"
werkzeug = "^3.1.3"
requests = "^2.32.0"
ddtrace = "^3.16.2"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
python-multipart = "^0.0.9"
pyjwt = "^2.9.0"
prometheus-fastapi-instrumentator = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pylint = "^2.17.4"
pytest = "^7.4.0"
flake8 = "^6.1.0"
jupyterlab = "^4.0.2"
coverage = "^7.3.0"
pytest-cov = "^5.0.0"
fakeredis = {extras = ["lua"], version = "^2.23.0"}
poetry-plugin-export = "^1.7.1"
pytest-dotenv = "^0.5.2"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.0"
pytest-postgresql = "^6.1.1"

[tool.pytest.ini_options]
testpaths = ["tests_fastapi"]
