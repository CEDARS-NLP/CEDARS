# Stand-in for the internal ALB in infra/cedars-v2/alb.tf. Keep the two in step;
# `control-cedars parity check` diffs the values marked "alb.tf:" below.
#
# Mirrored:
#   - Listener rules: /api/* and /ws/* -> backend target group, everything else ->
#     frontend target group. Like the ALB pattern, "/api" with no slash goes to the
#     frontend.
#   - idle_timeout = 300 (alb.tf), on proxy reads, sends and client keepalive.
#   - Backend target group stickiness: lb_cookie, cookie_duration 3600. The cookie is
#     named AWSALB, as on a real ALB. The frontend target group has no stickiness.
#   - Targets are re-resolved as replicas come and go (server ... resolve).
#   - WebSocket upgrade passthrough, no request body limit, no response buffering.
#   - HTTP only (enable_https = false on dev).
#
# Not mirrored:
#   - Active target health checks. OSS nginx only does passive checks; stack up
#     polls /api/v1/health itself.
#   - ALB-generated 502/503/504 bodies.
#   - Deregistration delay and connection draining.

resolver 127.0.0.11 valid=5s ipv6=off;

map $cookie_AWSALB $alb_sticky_key {
    ""      $request_id;
    default $cookie_AWSALB;
}

map $cookie_AWSALB $alb_sticky_set {
    ""      "AWSALB=$request_id; Max-Age=3600; Path=/";  # alb.tf: cookie_duration = 3600
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend_tg {
    zone backend_tg 64k;
    hash $alb_sticky_key consistent;
    server backend:8000 resolve;
}

upstream frontend_tg {
    zone frontend_tg 64k;
    server frontend:80 resolve;
}

log_format alb '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
               'rt=$request_time target=$upstream_addr';

server {
    listen 80;
    access_log /dev/stdout alb;

    client_max_body_size 0;
    keepalive_timeout 300s;      # alb.tf: idle_timeout = 300
    client_body_timeout 300s;
    send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {             # alb.tf: path_pattern "/api/*"
        add_header Set-Cookie $alb_sticky_set always;
        proxy_pass http://backend_tg;
    }

    location /ws/ {              # alb.tf: path_pattern "/ws/*"
        add_header Set-Cookie $alb_sticky_set always;
        proxy_pass http://backend_tg;
    }

    location / {                 # alb.tf: default action -> frontend
        proxy_pass http://frontend_tg;
    }
}
