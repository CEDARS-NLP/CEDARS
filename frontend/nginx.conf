server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    # /api and /ws proxying is only used in docker-compose (service name
    # "backend"). In ECS the ALB routes /api and /ws to the backend directly, so
    # these blocks never fire. Using a variable + resolver defers DNS resolution
    # to request time, so nginx boots even when "backend" doesn't resolve (ECS) —
    # avoids the "host not found in upstream" crash on startup.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream http://backend:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
