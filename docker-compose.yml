# Settings and configurations that are common for all containers
x-minio-common: &minio-common
  image: quay.io/minio/minio:${MINIO_VERSION}
  command: server --console-address ":9001" http://minio/data{1...2}
  expose:
    - ${MINIO_PORT}
    - "9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
    MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  web:
    build:
      context: ./cedars
    image: cedars
    restart: always
    # flask requires SIGINT to stop gracefully
    # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    depends_on:
      - redis
    networks:
      - cedars
    env_file:
      - .env
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio
    deploy:
      resources:
        limits:
          memory: '4g'
          cpus: '4.0'
        reservations:
          memory: '1g'
          cpus: '1.0'
  db:
    image: mongo:latest
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PWD}
    volumes:
      - cedars_db:/data/db
    command: mongod --quiet --logpath /dev/null 
    networks:
      - cedars
    profiles:
      - selfhosted
      - superbio

  minio:
    <<: *minio-common
    hostname: minio
    restart: always
    ports:
      - "9000:${MINIO_PORT}"
      - "9001:9001"
    volumes:
      - data2-1:/data1
      - data2-2:/data2
    networks:
      - cedars
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  nginx:
    image: nginx:1.19.2-alpine
    hostname: nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - minio
    networks:
      - cedars
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  prometheus:
    user: root
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - cedars
    depends_on:
      - web     
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  pines:
    build:
      context: ./PINES
    deploy:
      mode: replicated
      replicas: ${PINES_WORKERS}
    restart: on-failure:5
    networks:
      - cedars
    profiles: [cpu]

  pines-gpu:
    build:
      context: ./PINES
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_SCALE}
              capabilities: [gpu]
      mode: replicated
      replicas: ${PINES_WORKERS}
    restart: on-failure:5
    networks:
      - cedars
    profiles: [gpu]

  # ==================================================
  # OLLAMA SERVICE - LLM Inference Engine for PINES-LLM
  # ==================================================
  ollama:
    image: ollama/ollama:latest
    container_name: cedars-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cedars
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  # ==================================================
  # OLLAMA GPU VERSION
  # ==================================================
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: cedars-ollama-gpu
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cedars
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - gpu

  # ==================================================
  # PINES-LLM - LLM-based Clinical Event Detection
  # ==================================================
  pines-llm:
    build:
      context: ./PINES-LLM
      dockerfile: Dockerfile
    container_name: cedars-pines-llm
    restart: unless-stopped
    networks:
      - cedars
    # No external port mapping - internal access only (like original PINES)
    # To test: docker exec cedars_web_1 curl http://pines-llm:8036/healthcheck
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8036/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: '2g'
          cpus: '2.0'
        reservations:
          memory: '512m'
          cpus: '0.5'
    profiles:
      - cpu
      - selfhosted
      - superbio

  # ==================================================
  # PINES-LLM GPU VERSION
  # ==================================================
  pines-llm-gpu:
    build:
      context: ./PINES-LLM
      dockerfile: Dockerfile
    container_name: cedars-pines-llm-gpu
    restart: unless-stopped
    networks:
      - cedars
    # No external port mapping - internal access only
    environment:
      - OLLAMA_URL=http://ollama-gpu:11434
    depends_on:
      ollama-gpu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8036/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    profiles:
      - gpu

  # ==================================================
  # OLLAMA MODEL LOADER - Pulls models on first startup
  # ==================================================
  ollama-setup:
    image: ollama/ollama:latest
    container_name: cedars-ollama-setup
    networks:
      - cedars
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
      echo 'Waiting for Ollama to be ready...' &&
      sleep 10 &&
      echo 'Pulling llama3.1:8b model...' &&
      ollama pull llama3.1:8b --host http://ollama:11434 &&
      echo 'Model pulled successfully!' &&
      exit 0
      "
    profiles:
      - cpu
      - selfhosted
      - superbio
    restart: "no"

  redis:
    build:
        context: ./redis
        dockerfile: Dockerfile
    image: redis:7.2-alpine
    restart: always
    ports:
        - 6379:6379
    # Run the init script
    command: sh -c "./init.sh"
    # Run as privileged to allow the container to change the vm.overcommit_memory setting
    privileged: true
    volumes:
        - redis_data:/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cedars
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  worker-task:
    image: cedars
    command: python -m app.make_rq task
    scale: ${WORKER_SCALE}
    networks:
      - cedars
    env_file:
      - .env
    depends_on:
      - web
      - redis
    profiles:
      - cpu
      - gpu
      - selfhosted   
      - superbio
    deploy:
      resources:
        limits:
          memory: '4g'
          cpus: '1.5'
        reservations:
          memory: '1g'
          cpus: '1.0'
    
  worker-ops:
    image: cedars
    command: python -m app.make_rq ops
    scale: 1
    networks:
      - cedars
    env_file:
      - .env
    depends_on:
      - web
      - redis
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio
    deploy:
      resources:
        limits:
          memory: '2g'
          cpus: '1.0'
        reservations:
          memory: '1g'
          cpus: '1.0'
    
volumes:
  data2-1:
  data2-2:
  cedars_db:
  redis_data:
  prometheus_data:
  ollama_data:
networks:
  cedars:
    driver: bridge
