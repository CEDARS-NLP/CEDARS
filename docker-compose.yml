# Settings and configurations that are common for all containers
x-cedars-common: &cedars-common
  build:
    context: ./cedars
  image: cedars

x-minio-common: &minio-common
  image: quay.io/minio/minio:${MINIO_VERSION}
  command: server --console-address ":9001" http://minio/data{1...2}
  expose:
    - ${MINIO_PORT}
    - "9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
    MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  backend:
    <<: *cedars-common
    restart: always
    command: gunicorn -c gunicorn.conf.py app.main:app --log-level warning
    # uvicorn worker handles SIGINT/SIGTERM gracefully
    stop_signal: SIGINT
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
      global-db-init:
        condition: service_completed_successfully
    networks:
      - cedars
    env_file:
      - .env
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio
    deploy:
      resources:
        limits:
          memory: '4g'
          cpus: '4.0'
        reservations:
          memory: '1g'
          cpus: '1.0'
  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      # The account/project registry database. The built-in ``postgres``
      # database remains available for admin CREATE/DROP DATABASE operations.
      POSTGRES_DB: ${GLOBAL_DB_NAME:-cedars_global}
    volumes:
      - cedars_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${GLOBAL_DB_NAME:-cedars_global}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cedars
    profiles:
      - selfhosted
      - superbio

  global-db-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: ${DB_PORT}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PWD}
      GLOBAL_DB_NAME: ${GLOBAL_DB_NAME:-cedars_global}
    command:
      - sh
      - -ec
      - >-
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${GLOBAL_DB_NAME}'" | grep -q 1; then
          psql -d postgres -c "CREATE DATABASE \"$${GLOBAL_DB_NAME}\"";
        fi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cedars
    profiles:
      - selfhosted
      - superbio

  global-db-init:
    <<: *cedars-common
    restart: "no"
    command: python -c "from app.database.init_db import initialize_application; initialize_application()"
    env_file:
      - .env
    depends_on:
      global-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - cedars
    profiles:
      - selfhosted
      - superbio


  minio:
    <<: *minio-common
    hostname: minio
    restart: always
    ports:
      - "9000:${MINIO_PORT}"
      - "9001:9001"
    volumes:
      - data2-1:/data1
      - data2-2:/data2
    networks:
      - cedars
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  frontend:
    build:
      context: ./cedars/app/frontend
    image: cedars-frontend
    hostname: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cedars
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  prometheus:
    user: root
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - cedars
    depends_on:
      - backend
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  pines:
    build:
      context: ./PINES
    deploy:
      mode: replicated
      replicas: ${PINES_WORKERS}
    restart: on-failure:5
    networks:
      - cedars
    profiles: [cpu]

  pines-gpu:
    build:
      context: ./PINES
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_SCALE}
              capabilities: [gpu]
      mode: replicated
      replicas: ${PINES_WORKERS}
    restart: on-failure:5
    networks:
      - cedars
    profiles: [gpu]

  redis:
    build:
        context: ./redis
        dockerfile: Dockerfile
    image: redis:7.2-alpine
    restart: always
    ports:
        - 6379:6379
    # Run the init script
    # command: sh -c "./init.sh"
    # Run as privileged to allow the container to change the vm.overcommit_memory setting
    # privileged: true
    volumes:
        - redis_data:/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cedars
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio

  worker-task:
    <<: *cedars-common
    command: python -m app.make_rq task
    scale: ${WORKER_SCALE}
    networks:
      - cedars
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    profiles:
      - cpu
      - gpu
      - selfhosted   
      - superbio
    deploy:
      resources:
        limits:
          memory: '4g'
          cpus: '1.5'
        reservations:
          memory: '1g'
          cpus: '1.0'
    
  worker-ops:
    <<: *cedars-common
    command: python -m app.make_rq ops
    scale: 1
    networks:
      - cedars
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    profiles:
      - cpu
      - gpu
      - selfhosted
      - superbio
    deploy:
      resources:
        limits:
          memory: '2g'
          cpus: '1.0'
        reservations:
          memory: '1g'
          cpus: '1.0'
    
volumes:
  data2-1:
  data2-2:
  cedars_db:
  redis_data:
  prometheus_data:
networks:
  cedars:
    driver: bridge
