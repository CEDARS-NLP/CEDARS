name: Secret scan

on:
  pull_request:
  push:
    branches:
      - "main"
      - "feature/v2-platform"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      # Pull requests and pushes scan only the commits they add, so the job
      # gates new work. A manual run scans the full history of every branch.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              log_opts="${PR_BASE}..HEAD" ;;
            push)
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                log_opts="${PUSH_BEFORE}..HEAD"
              else
                # New ref or force-push: the old tip isn't available.
                log_opts="-1 HEAD"
              fi ;;
            *)
              log_opts="--all" ;;
          esac
          echo "Scanning: git log ${log_opts}"
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="${log_opts}" .
